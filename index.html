<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AAM 데일리 트렌드 브리핑</title>
<style>
  :root { --bg:#faf8f5; --card:#fff; --ink:#1f2328; --sub:#6b7280; --line:#e7e2da; --accent:#c2410c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,"Pretendard","Noto Sans KR",sans-serif; line-height:1.65; }
  header { max-width:760px; margin:0 auto; padding:40px 20px 12px; }
  header small { color:var(--accent); font-weight:700; letter-spacing:.04em; }
  header h1 { margin:6px 0 4px; font-size:28px; }
  header p { margin:0; color:var(--sub); }
  main { max-width:760px; margin:0 auto; padding:8px 20px 80px; }
  .headline { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin:16px 0 8px; font-size:17px; font-weight:600; }
  section { margin-top:28px; }
  section h2 { font-size:18px; margin:0 0 10px; padding-left:10px; border-left:4px solid var(--accent); }
  .item { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-bottom:10px; }
  .item h3 { margin:0 0 4px; font-size:16px; }
  .item p { margin:0; color:#374151; }
  .tip { margin-top:8px; padding:8px 10px; background:#fff7ed; border-radius:8px; font-size:14px; }
  .src { margin-top:6px; font-size:13px; color:var(--sub); }
  .src a { color:var(--sub); }
  nav { display:flex; flex-wrap:wrap; gap:6px; margin-top:14px; }
  nav button { border:1px solid var(--line); background:var(--card); border-radius:999px; padding:6px 12px; font-size:13px; cursor:pointer; color:var(--ink); }
  nav button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .empty { color:var(--sub); padding:40px 0; text-align:center; }
  footer { text-align:center; color:var(--sub); font-size:12px; padding:24px; }
</style>
</head>
<body>
<header>
  <small>AAM DAILY TREND</small>
  <h1>AI · 마케팅 데일리 브리핑</h1>
  <p id="meta">불러오는 중…</p>
  <nav id="dates"></nav>
</header>
<main id="view"></main>
<footer>매일 아침 자동 업데이트 · AAM Studio</footer>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function getJSON(path) {
  const r = await fetch(path, { cache: "no-store" });
  if (!r.ok) throw new Error(path);
  return r.json();
}

function render(b) {
  $("meta").textContent = b.date + " · " + (b.updated || "");
  const secs = (b.sections || []).map(s => `
    <section>
      <h2>${esc(s.title)}</h2>
      ${(s.items || []).map(it => `
        <div class="item">
          <h3>${esc(it.title)}</h3>
          <p>${esc(it.summary)}</p>
          ${it.tip ? `<div class="tip">💡 ${esc(it.tip)}</div>` : ""}
          ${it.url ? `<div class="src">출처: <a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.source || it.url)}</a></div>` : ""}
        </div>`).join("")}
    </section>`).join("");
  $("view").innerHTML = (b.headline ? `<div class="headline">${esc(b.headline)}</div>` : "") + secs;
}

async function load(date, dates) {
  const b = await getJSON(`data/${date}.json`);
  render(b);
  $("dates").innerHTML = dates.slice(0, 14).map(d =>
    `<button class="${d === date ? "on" : ""}" data-d="${d}">${d.slice(5)}</button>`).join("");
  $("dates").querySelectorAll("button").forEach(btn => btn.onclick = () => load(btn.dataset.d, dates));
}

(async () => {
  try {
    const idx = await getJSON("data/index.json");
    if (!idx.dates || !idx.dates.length) throw new Error("empty");
    await load(idx.dates[0], idx.dates);
  } catch (e) {
    $("meta").textContent = "";
    $("view").innerHTML = '<div class="empty">첫 브리핑을 준비 중이에요. 내일 아침에 만나요 ☀️</div>';
  }
})();
</script>
</body>
</html>
